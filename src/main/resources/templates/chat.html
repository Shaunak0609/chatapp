<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'#' + ${room} + ' – SheepChat'">SheepChat</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- ========================================================
     PRIVATE ROOM CREATION MODAL
     ======================================================== -->
<div id="privateRoomModal" class="modal-overlay" style="display:none">
    <div class="modal-box">
        <div class="modal-header">
            <h3>Create Private Room</h3>
            <button type="button" class="modal-close" onclick="closeModal()">&#10005;</button>
        </div>

        <form action="/rooms/create" method="post" class="modal-form">
            <input type="hidden" name="privateRoom" value="true">

            <label class="field-label" for="prRoomName">Room name</label>
            <input id="prRoomName" type="text" name="roomName"
                   placeholder="e.g. dev-team" required
                   pattern="[a-zA-Z0-9_\-]{1,50}"
                   title="Letters, numbers, hyphens, underscores (max 50)">

            <label class="field-label">Invite users</label>

            <div class="invite-user-list" th:if="${not #lists.isEmpty(allUsernames)}">
                <label th:each="uname : ${allUsernames}" class="invite-user-row">
                    <input type="checkbox" name="invitees" th:value="${uname}">
                    <span th:text="${uname}"></span>
                </label>
            </div>
            <p th:if="${#lists.isEmpty(allUsernames)}" class="dim-text">No other users registered yet.</p>

            <label class="field-label" for="prManualUser">Or type a username</label>
            <input id="prManualUser" type="text" name="inviteByUsername"
                   placeholder="username…" autocomplete="off">

            <div class="modal-actions">
                <button type="submit" class="btn-primary">Create Room</button>
                <button type="button" class="btn-ghost" onclick="closeModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<!-- ========================================================
     MAIN LAYOUT
     ======================================================== -->
<div class="chat-container">

    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar">
        <div class="sidebar-header">🐑 SheepChat</div>

        <!-- Quick create / join PUBLIC room -->
        <div class="sidebar-section-label">Rooms</div>
        <div class="create-room-form">
            <form action="/chat" method="get" style="display:flex;gap:4px;width:100%">
                <input type="text" name="room" placeholder="Join / create room…" required>
                <button type="submit" title="Join or create public room">+</button>
            </form>
        </div>

        <!-- Create private room button -->
        <div style="padding:0 8px 6px">
            <button type="button" class="btn-create-private" onclick="openModal()">
                &#128274; Create Private Room
            </button>
        </div>

        <!-- Room list -->
        <ul class="room-list">
            <li th:each="r : ${rooms}" class="room-item">
                <a th:href="@{/chat(room=${r.name})}"
                   th:class="${r.name == room} ? 'room-link active' : 'room-link'">
                    <span th:if="${r.privateRoom}" class="room-lock">&#128274;</span>
                    <span th:text="'# ' + ${r.name}"></span>
                </a>

                <form th:if="${r.name != 'general'
                               and (not r.privateRoom or r.ownerUsername == username)}"
                      action="/rooms/delete" method="post" style="margin:0">
                    <input type="hidden" name="room" th:value="${r.name}">
                    <button type="submit" class="room-delete-btn" title="Delete room">&#10005;</button>
                </form>
            </li>
        </ul>

        <!-- Footer: user info + invites + logout -->
        <div class="sidebar-footer">
            <div class="current-user">
                <span th:text="${username}">User</span>
                <small>Online</small>
            </div>

            <button type="button" id="invitesToggleBtn" class="invites-toggle-btn"
                    title="Pending invites"
                    onclick="toggleInvitesPanel()">
                &#128276;
                <span th:if="${pendingInvites.size() > 0}"
                      class="invite-badge"
                      th:text="${pendingInvites.size()}">0</span>
            </button>

            <form action="/logout" method="get" style="margin:0">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
    </div>

    <!-- ===== INVITES PANEL (slides in over the chat area) ===== -->
    <div id="invitesPanel" class="invites-panel" style="display:none">
        <div class="invites-panel-header">
            <h3>Pending Invites</h3>
            <button type="button" class="modal-close" onclick="toggleInvitesPanel()">&#10005;</button>
        </div>

        <div class="invites-list">
            <div th:each="inv : ${pendingInvites}" class="invite-card">
                <div class="invite-info">
                    <span class="invite-room">&#128274; #<span th:text="${inv.roomName}"></span></span>
                    <span class="invite-from">invited by <strong th:text="${inv.inviterUsername}"></strong></span>
                </div>
                <div class="invite-actions">
                    <form action="/invites/accept" method="post" style="display:inline">
                        <input type="hidden" name="inviteId" th:value="${inv.id}">
                        <button type="submit" class="btn-accept">Accept</button>
                    </form>
                    <form action="/invites/decline" method="post" style="display:inline">
                        <input type="hidden" name="inviteId" th:value="${inv.id}">
                        <button type="submit" class="btn-decline">Decline</button>
                    </form>
                </div>
            </div>

            <p th:if="${pendingInvites.size() == 0}" class="no-invites">
                No pending invites
            </p>
        </div>
    </div>

    <!-- ===== CHAT MAIN ===== -->
    <div class="chat-main">
        <div class="chat-header">
            <span class="hash">#</span>
            <span th:text="${room}">general</span>
            <span th:if="${currentRoom != null and currentRoom.privateRoom}"
                  class="private-badge">&#128274; private</span>
        </div>

        <!-- Flash notifications -->
        <div th:if="${chatError}" class="notification notification-error" th:text="${chatError}"></div>
        <div th:if="${chatSuccess}" class="notification notification-success" th:text="${chatSuccess}"></div>

        <div id="chatBox" class="chat-box"></div>

        <div class="chat-input-area">
            <div id="attachmentPreview" class="attachment-preview"></div>
            <div class="chat-input-bar">
                <button type="button" class="upload-btn" id="uploadBtn" title="Upload image or file">+</button>
                <input type="file" id="fileInput" style="display:none"
                       accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.txt,.doc,.docx">
                <input id="messageInput" type="text"
                       th:placeholder="'Message #' + ${room}"
                       onkeydown="handleKeyPress(event)">
                <button type="button" class="send-btn" onclick="sendMessage()" title="Send">&#10148;</button>
            </div>
        </div>
    </div>
</div>

<!-- Server data for JS -->
<span id="roomHolder" th:text="${room}" style="display:none"></span>

<script>
    // ---- WebSocket ----
    const room = document.getElementById("roomHolder").innerText;
    const protocol = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(
        protocol + "://" + location.host + "/ws/chat?room=" + encodeURIComponent(room)
    );

    ws.onmessage = (event) => {
        let data;
        try { data = JSON.parse(event.data); }
        catch (_) { appendLegacyText(event.data); return; }

        if (data.type === "system" && data.content === "__ROOM_DELETED__") {
            alert("This room was deleted.");
            location.href = "/chat?room=general";
            return;
        }
        if (data.type === "message") appendMessage(data);
    };

    ws.onerror = () => console.error("WebSocket error");

    // ---- Rendering ----
    function escapeHtml(str) {
        if (!str) return "";
        const d = document.createElement("div");
        d.appendChild(document.createTextNode(str));
        return d.innerHTML;
    }

    function formatTime(iso) {
        if (!iso) return "";
        try { return new Date(iso).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}); }
        catch (_) { return ""; }
    }

    function scrollDown() {
        const box = document.getElementById("chatBox");
        box.scrollTop = box.scrollHeight;
    }

    function appendMessage(msg) {
        const box = document.getElementById("chatBox");
        const el = document.createElement("div");
        el.className = "message";

        let html = `<div class="msg-header">
            <span class="msg-username">${escapeHtml(msg.username)}</span>
            <span class="msg-time">${formatTime(msg.timestamp)}</span>
        </div>`;

        if (msg.content && msg.content.trim()) {
            html += `<div class="msg-body">${escapeHtml(msg.content)}</div>`;
        }

        if (msg.attachmentUrl) {
            const isImage = msg.attachmentType && msg.attachmentType.startsWith("image/");
            if (isImage) {
                html += `<div class="msg-attachment">
                    <a href="${msg.attachmentUrl}" target="_blank" rel="noopener">
                        <img src="${msg.attachmentUrl}" alt="${escapeHtml(msg.attachmentName)}" class="msg-image">
                    </a>
                </div>`;
            } else {
                html += `<div class="msg-attachment">
                    <a href="${msg.attachmentUrl}" target="_blank" rel="noopener" class="msg-file-link">
                        &#128206; ${escapeHtml(msg.attachmentName)}
                    </a>
                </div>`;
            }
        }

        el.innerHTML = html;
        box.appendChild(el);
        scrollDown();
    }

    function appendLegacyText(text) {
        const box = document.getElementById("chatBox");
        const el = document.createElement("div");
        el.className = "message";
        el.innerHTML = `<div class="msg-body">${escapeHtml(text)}</div>`;
        box.appendChild(el);
        scrollDown();
    }

    // ---- File upload ----
    let pendingAttachment = null;

    document.getElementById("uploadBtn").addEventListener("click", () => {
        document.getElementById("fileInput").click();
    });

    document.getElementById("fileInput").addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const fd = new FormData();
        fd.append("file", file);
        try {
            const resp = await fetch("/attachments/upload", {method: "POST", body: fd});
            const result = await resp.json();
            if (resp.ok) {
                pendingAttachment = result;
                document.getElementById("attachmentPreview").innerHTML =
                    `&#128206; ${escapeHtml(result.name)} ` +
                    `<button class="clear-att" onclick="clearAttachment()">&#10005;</button>`;
            } else {
                alert("Upload failed: " + (result.error || "Unknown error"));
            }
        } catch (err) {
            alert("Upload error: " + err.message);
        }
        e.target.value = "";
    });

    function clearAttachment() {
        pendingAttachment = null;
        document.getElementById("attachmentPreview").innerHTML = "";
    }

    // ---- Send message ----
    function sendMessage() {
        const input = document.getElementById("messageInput");
        const content = input.value.trim();
        if (!content && !pendingAttachment) return;
        ws.send(JSON.stringify({
            content: content,
            attachmentId: pendingAttachment ? pendingAttachment.id : null
        }));
        input.value = "";
        clearAttachment();
    }

    function handleKeyPress(e) {
        if (e.key === "Enter") sendMessage();
    }

    // ---- Invites panel ----
    function toggleInvitesPanel() {
        const panel = document.getElementById("invitesPanel");
        panel.style.display = panel.style.display === "none" ? "flex" : "none";
    }

    // ---- Private room modal ----
    function openModal() {
        document.getElementById("privateRoomModal").style.display = "flex";
        document.getElementById("prRoomName").focus();
    }

    function closeModal() {
        document.getElementById("privateRoomModal").style.display = "none";
    }

    // Close modal on overlay click
    document.getElementById("privateRoomModal").addEventListener("click", (e) => {
        if (e.target === document.getElementById("privateRoomModal")) closeModal();
    });

    // Close modal with Escape
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
    });
</script>

</body>
</html>
