<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'#' + ${room} + ' – SheepChat'">SheepChat</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="chat-container">

    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar">
        <div class="sidebar-header">🐑 SheepChat</div>

        <div class="sidebar-section-label">Rooms</div>

        <div class="create-room-form">
            <form action="/chat" method="get" style="display:flex;gap:4px;width:100%">
                <input type="text" name="room" placeholder="New room…" required>
                <button type="submit" title="Join or create room">+</button>
            </form>
        </div>

        <ul class="room-list">
            <li th:each="r : ${rooms}" class="room-item">
                <a th:href="@{/chat(room=${r.name})}"
                   th:text="'# ' + ${r.name}"
                   th:class="${r.name == room} ? 'room-link active' : 'room-link'"></a>

                <form th:if="${r.name != 'general'}"
                      action="/rooms/delete" method="post"
                      style="margin:0">
                    <input type="hidden" name="room" th:value="${r.name}">
                    <button type="submit" class="room-delete-btn" title="Delete room">✕</button>
                </form>
            </li>
        </ul>

        <div class="sidebar-footer">
            <div class="current-user">
                <span th:text="${username}">User</span>
                <small>Online</small>
            </div>
            <form action="/logout" method="get" style="margin:0">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
    </div>

    <!-- ===== CHAT MAIN ===== -->
    <div class="chat-main">
        <div class="chat-header">
            <span class="hash">#</span>
            <span th:text="${room}">general</span>
        </div>

        <div id="chatBox" class="chat-box"></div>

        <div class="chat-input-area">
            <div id="attachmentPreview" class="attachment-preview"></div>
            <div class="chat-input-bar">
                <button type="button" class="upload-btn" id="uploadBtn" title="Upload image or file">+</button>
                <input type="file" id="fileInput" style="display:none"
                       accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.txt,.doc,.docx">
                <input id="messageInput" type="text"
                       th:placeholder="'Message #' + ${room}"
                       onkeydown="handleKeyPress(event)">
                <button type="button" class="send-btn" onclick="sendMessage()" title="Send">&#10148;</button>
            </div>
        </div>
    </div>
</div>

<!-- Server data passed to JS -->
<span id="roomHolder" th:text="${room}" style="display:none"></span>

<script>
    const room = document.getElementById("roomHolder").innerText;

    const protocol = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(
        protocol + "://" + location.host + "/ws/chat?room=" + encodeURIComponent(room)
    );

    ws.onmessage = (event) => {
        let data;
        try {
            data = JSON.parse(event.data);
        } catch (_) {
            appendLegacyText(event.data);
            return;
        }

        if (data.type === "system" && data.content === "__ROOM_DELETED__") {
            alert("This room was deleted.");
            location.href = "/chat?room=general";
            return;
        }

        if (data.type === "message") {
            appendMessage(data);
        }
    };

    ws.onerror = () => console.error("WebSocket error");

    // ---- Rendering helpers ----

    function escapeHtml(str) {
        if (!str) return "";
        const d = document.createElement("div");
        d.appendChild(document.createTextNode(str));
        return d.innerHTML;
    }

    function formatTime(iso) {
        if (!iso) return "";
        try {
            return new Date(iso).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
        } catch (_) {
            return "";
        }
    }

    function scrollDown() {
        const box = document.getElementById("chatBox");
        box.scrollTop = box.scrollHeight;
    }

    function appendMessage(msg) {
        const box = document.getElementById("chatBox");
        const el = document.createElement("div");
        el.className = "message";

        let html = `<div class="msg-header">
            <span class="msg-username">${escapeHtml(msg.username)}</span>
            <span class="msg-time">${formatTime(msg.timestamp)}</span>
        </div>`;

        if (msg.content && msg.content.trim()) {
            html += `<div class="msg-body">${escapeHtml(msg.content)}</div>`;
        }

        if (msg.attachmentUrl) {
            const isImage = msg.attachmentType && msg.attachmentType.startsWith("image/");
            if (isImage) {
                html += `<div class="msg-attachment">
                    <a href="${msg.attachmentUrl}" target="_blank" rel="noopener">
                        <img src="${msg.attachmentUrl}"
                             alt="${escapeHtml(msg.attachmentName)}"
                             class="msg-image">
                    </a>
                </div>`;
            } else {
                html += `<div class="msg-attachment">
                    <a href="${msg.attachmentUrl}" target="_blank" rel="noopener"
                       class="msg-file-link">
                        &#128206; ${escapeHtml(msg.attachmentName)}
                    </a>
                </div>`;
            }
        }

        el.innerHTML = html;
        box.appendChild(el);
        scrollDown();
    }

    function appendLegacyText(text) {
        const box = document.getElementById("chatBox");
        const el = document.createElement("div");
        el.className = "message";
        el.innerHTML = `<div class="msg-body">${escapeHtml(text)}</div>`;
        box.appendChild(el);
        scrollDown();
    }

    // ---- File upload ----

    let pendingAttachment = null;

    document.getElementById("uploadBtn").addEventListener("click", () => {
        document.getElementById("fileInput").click();
    });

    document.getElementById("fileInput").addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const fd = new FormData();
        fd.append("file", file);

        try {
            const resp = await fetch("/attachments/upload", {method: "POST", body: fd});
            const result = await resp.json();
            if (resp.ok) {
                pendingAttachment = result;
                const preview = document.getElementById("attachmentPreview");
                preview.innerHTML =
                    `&#128206; ${escapeHtml(result.name)} ` +
                    `<button class="clear-att" onclick="clearAttachment()">&#10005;</button>`;
            } else {
                alert("Upload failed: " + (result.error || "Unknown error"));
            }
        } catch (err) {
            alert("Upload error: " + err.message);
        }

        e.target.value = "";
    });

    function clearAttachment() {
        pendingAttachment = null;
        document.getElementById("attachmentPreview").innerHTML = "";
    }

    // ---- Send ----

    function sendMessage() {
        const input = document.getElementById("messageInput");
        const content = input.value.trim();
        if (!content && !pendingAttachment) return;

        ws.send(JSON.stringify({
            content: content,
            attachmentId: pendingAttachment ? pendingAttachment.id : null
        }));

        input.value = "";
        clearAttachment();
    }

    function handleKeyPress(e) {
        if (e.key === "Enter") sendMessage();
    }
</script>

</body>
</html>
