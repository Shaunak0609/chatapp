<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheepChat – Login</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">

<div class="auth-card">
    <h1>🐑 SheepChat</h1>
    <p class="auth-subtitle">Welcome back! Log in to continue.</p>

    <div th:if="${param.error}" class="error-banner">
        Incorrect username or password.
    </div>
    <div th:if="${param.logout}" class="success-banner">
        You have been logged out.
    </div>

    <form method="post" action="/login">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Enter your username" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter your password" required>

        <button type="submit">Log In</button>
    </form>

    <p class="auth-footer">
        New here? <a href="/register">Create an account</a>
    </p>
</div>

</body>
</html>
